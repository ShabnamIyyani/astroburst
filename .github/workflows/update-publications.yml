name: Update publications from NASA ADS

on:
  schedule:
    - cron: "17 2 * * *"      # every day at 02:17 UTC
  workflow_dispatch:          # also allows a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the library from NASA ADS
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
        run: python scripts/update_publications.py
      - name: Commit the new list if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/publications.json
          git diff --cached --quiet || (git commit -m "Update publications from NASA ADS" && git push)
